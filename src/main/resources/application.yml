spring:
  application:
    name: Bible-Search

# Bible data configuration
bible:
  data:
    json-path: ${BIBLE_JSON_PATH:classpath:bible/bible_krv.json}
    asv-json-path: ${BIBLE_ASV_JSON_PATH:classpath:bible/bible_asv.json}
  
  # Embedding configuration (Multilingual model for Korean + English)
  embedding:
    model-path: ${EMBEDDING_MODEL_PATH:classpath:models/bge-m3-ko/model.onnx}
    tokenizer-path: ${EMBEDDING_TOKENIZER_PATH:classpath:models/bge-m3-ko/tokenizer.json}
    chunk-size: 500
    chunk-overlap: 50
    # SQLite persistence (preferred for production - fastest cold start)
    sqlite:
      enabled: ${EMBEDDING_SQLITE_ENABLED:true}
      path: ${EMBEDDING_SQLITE_PATH:classpath:embeddings/bible-embeddings.db}
    # GCS persistence (fallback if SQLite not available)
    gcs:
      enabled: ${EMBEDDING_GCS_ENABLED:false}
      bucket: ${EMBEDDING_GCS_BUCKET:}
      blob-name: ${EMBEDDING_GCS_BLOB:embeddings/bible-embeddings.json}
  
  # Search configuration
  search:
    # Stage 1: Bi-encoder retrieval
    candidate-count: 50
    # Stage 2: Re-ranking & filtering
    result-count: 5
    min-score: 0.3
    # Score blending weights (ONNX reranker + embedding score)
    embedding-weight: ${SEARCH_EMBEDDING_WEIGHT:0.5}
    reranker-weight: ${SEARCH_RERANKER_WEIGHT:0.5}

  # Reranker configuration (BGE Reranker v2-m3 - quantized)
  reranker:
    enabled: ${RERANKER_ENABLED:true}
    model-path: ${RERANKER_MODEL_PATH:classpath:models/bge-reranker-v2-m3/model_quantized.onnx}
    tokenizer-path: ${RERANKER_TOKENIZER_PATH:classpath:models/bge-reranker-v2-m3/tokenizer.json}
    model-max-length: ${RERANKER_MAX_LENGTH:512}

  # Commentary database
  commentary:
    path: ${COMMENTARY_PATH:classpath:commentaries/commentaries.sqlite}

# Server configuration
server:
  port: 8080

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging
logging:
  level:
    io.github.nicechester: DEBUG
    dev.langchain4j: INFO
